syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/safullin/pro_go_3/internal/proto;gophkeeperpb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service GophKeeper {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc PutSecret(PutSecretRequest) returns (Secret);
  rpc GetSecret(GetSecretRequest) returns (Secret);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (google.protobuf.Empty);
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  bytes salt = 2;
}

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_CREDENTIALS = 1;
  SECRET_KIND_TEXT = 2;
  SECRET_KIND_BINARY = 3;
  SECRET_KIND_CARD = 4;
}

message Secret {
  string id = 1;
  SecretKind kind = 2;
  bytes ciphertext = 3;
  bytes nonce = 4;
  int64 version = 5;
  bool deleted = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PutSecretRequest {
  Secret secret = 1;
  int64 expected_version = 2;
}

message GetSecretRequest {
  string id = 1;
}

message ListSecretsRequest {
  int64 since_version = 1;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  int64 cursor = 2;
}

message DeleteSecretRequest {
  string id = 1;
  int64 expected_version = 2;
}

